  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  const b = document.getElementById("lang"); b.textContent = t.langBtn; b.setAttribute("aria-label", t.langLabel);

  chipsRow.innerHTML = MENU.map(c => `<a href="#${c.id}" data-c="${c.id}"><img src="img/${c.img}.webp" alt="">${c[lang]}</a>`).join("")
    + `<a href="#boissons" data-c="boissons"><img src="img/comptoir.webp" alt="">${t.drinksChip}</a>`;

  document.getElementById("menu").innerHTML = MENU.map((c, i) => `
    <section class="cat" id="${c.id}">
      <div class="banner"><img src="img/${c.img}.webp" alt="" ${i ? 'loading="lazy"' : ""}>
        <div class="t"><h2 class="brush">${c[lang]}</h2><p>${lang === "ar" ? c.subAr : c.subFr}</p></div></div>
      <div class="panel">${c.groups.map(g => `${g[lang] ? `<p class="sub-h">${g[lang]}</p>` : ""}<ul class="items">${g.items.map(([ar, fr, p, dar, dfr, ph, tag]) => {
        const name = lang === "ar" ? ar : fr, alt = lang === "ar" ? fr : ar;
        return `<li>${ph ? `<img class="ph" src="img/t/${ph}.webp" alt="" loading="lazy">` : ""}
          <div class="tx"><span class="nm">${name}</span>${tag ? `<span class="tag ${tag}">${t[tag]}</span>` : ""}<span class="ds" dir="${other === "ar" ? "rtl" : "ltr"}">${alt}</span></div>
          ${p ? `<span class="pr" dir="ltr">${fmt(p)}<small>${t.cur}</small></span>` : `<span class="pr ask">${t.ask}</span>`}</li>`;
      }).join("")}</ul>`).join("")}</div>
    </section>`).join("") + `
    <section class="note-card" id="boissons" style="scroll-margin-top:70px"><span class="ic" aria-hidden="true">🥤</span><div><b>${t.drinksT}</b><p>${t.drinksP}</p></div></section>`;
  current = ""; onScroll();
}

// Active chip follows the section being read; only the chip row scrolls sideways, never the page.
let current = "", ticking = false;
function onScroll() {
  ticking = false;
  const secs = document.querySelectorAll(".cat, #boissons");
  let id = secs[0] && secs[0].id;
  secs.forEach(s => { if (s.getBoundingClientRect().top < 140) id = s.id; });
  if (id === current) return;
  current = id;
  chipsRow.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.c === id));
  const on = chipsRow.querySelector("a.on"); if (!on) return;
  chipsRow.scrollTo({ left: on.offsetLeft - (chipsRow.clientWidth - on.offsetWidth) / 2, behavior: "auto" });
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

chipsRow.addEventListener("click", e => {
  const a = e.target.closest("a[data-c]"); if (!a) return;
  e.preventDefault();
  const s = document.getElementById(a.dataset.c);
  scrollTo({ top: s.getBoundingClientRect().top + scrollY - 64, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

document.getElementById("lang").addEventListener("click", () => {
  const keep = current;
  lang = lang === "ar" ? "fr" : "ar";
  try { localStorage.setItem("cesar-lang", lang); } catch (e) {}
  render();
  if (keep && scrollY > 300) { const s = document.getElementById(keep); s && scrollTo({ top: s.getBoundingClientRect().top + scrollY - 64 }); }
});
render();
</script>
</body>
</html>
